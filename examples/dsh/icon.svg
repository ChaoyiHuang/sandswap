  <path d="M11 18.2 13 20.2l2-2M21 17.8 23 15.8l2 2" fill="none" stroke="#5a6472" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="9" y="8" width="7" height="5" rx="1" fill="#ffffff" opacity="0.85"/>
  <rect x="9" y="23" width="18" height="5" rx="1" fill="#ffffff" opacity="0.7"/>
