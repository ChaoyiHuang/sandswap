# DeepSeek Harness sandbox plugin (single entry).
#
# One row mounts the MCP connection to the Sandswap gateway AND applies the
# agent-level sandbox policy (hide/deny local shell and file-write tools,
# system-prompt guidance to run coding tasks inside the sandbox).
#
# The agent API key is read from the environment variable apiKeyEnv at mount
# time when apiKey is unset (deliberately not the generic SANDSWAP_API_KEY,
# which sandctl also reads and could hijack other tooling). Set it before
# starting DSH:
#   SANDSWAP_AGENT_API_KEY=sk-sandswap-agent-...
# On a TLS deployment whose dev certificates are CA-signed, start DSH with
# NODE_EXTRA_CA_CERTS=<deploy>/certs/ca.crt so Node accepts the certificate.
# restrictTools: local tools to sandbox away; [] keeps every local tool and
# only adds the guidance.
- insert:
    - id: sandswap-sandbox
      name: '@sandswap/dsh-sandbox'
      config:
        serverName: sandswap
        url: !!js >-
          process.env.SANDSWAP_URL?.trim() || 'https://localhost:3000/mcp'
        apiKeyEnv: SANDSWAP_AGENT_API_KEY
        restrictTools: [pwsh, bash, write, edit]
