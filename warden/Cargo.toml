[package]
name = "warden"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2.160"
nix = "0.23.0"
capctl = "0.2.0"
anyhow = "1.0.99"
lazy_static = "1.3.0"
futures = "0.3.17"

# Async runtime
tokio = { version = "1.45.1", features = ["full"] }
tokio-vsock = "0.5.0"

# Logging
# max_level_debug: slog's debug! macro is compiled to a no-op unless this
# feature is on — the runtime LevelFilter alone can never enable debug lines
# (bit us when wiring warden.log=debug: level parsed correctly, zero output).
slog = { version = "2.5.2", features = ["max_level_debug"] }
slog-scope = "4.1.2"
slog-stdlog = "4.0.0"
slog-async = "2.7.0"
log = "0.4.11"

# Guest network (rtnetlink)
rtnetlink = "0.14.0"
netlink-sys = { version = "0.7.0", features = ["tokio_socket"] }
netlink-packet-route = "0.19.0"
ipnetwork = "0.17.0"

# Clock (boot timing logs)
moniclock = "0.1.0"

# Tracing macros (span!/instrument! — the OTel exporter was removed)
tracing = "0.1.26"

# Configuration (kernel cmdline + optional TOML)
serde = { version = "1.0.129", features = ["derive"] }
serde_json = "1.0.99"
toml = "0.5.8"
time = { version = "0.3.41", features = ["formatting"] }

clap = { version = "3.0.1", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1

[[bin]]
name = "warden"
path = "src/main.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("seccomp"))'] }

[dev-dependencies]
tempfile = "3"
