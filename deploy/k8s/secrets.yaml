# Sandswap K8s Secrets — TLS certificates.
#
# This file is a TEMPLATE. Actual secret data is generated by
# deploy/k8s/gen-k8s-certs.sh and applied via kubectl. Do NOT commit
# real certificate data to version control.
#
# Etcd authentication is via mTLS (--client-cert-auth on the etcd server,
# --etcd-cert/--etcd-key on the gateway). No username/password secrets needed.
#
# To generate and apply:
#   bash deploy/k8s/gen-k8s-certs.sh | kubectl apply -f -
---
# etcd TLS certificates
apiVersion: v1
kind: Secret
metadata:
  name: etcd-certs
  namespace: sandswap
type: Opaque
data:
  ca.crt: Cg==  # placeholder — generated by gen-k8s-certs.sh
  server.crt: Cg==
  server.key: Cg==
  client.crt: Cg==
  client.key: Cg==
---
# Gateway TLS certificates (gRPC stream + MCP HTTP + human HTTPS)
apiVersion: v1
kind: Secret
metadata:
  name: gateway-certs
  namespace: sandswap
type: Opaque
data:
  ca.crt: Cg==  # placeholder — generated by gen-k8s-certs.sh
  stream.crt: Cg==
  stream.key: Cg==
  agent.crt: Cg==
  agent.key: Cg==
  human.crt: Cg==  # human /human/* HTTPS
  human.key: Cg==
---
# Sandlot stream client certificates — ONE SECRET PER NODE, plus the prov
# singleton. The gateway binds a stream hello's declared node_id to the
# presented client certificate's CN by EXACT match
# (gateway/stream/server.go verifyNodeIdentity), so there is no shared
# "sandlot-certs" Secret: gen-k8s-certs.sh mints `sandlot-certs-<node>` for
# every cluster node (CN=<node>) and `sandlot-certs-prov` for the provision
# Deployment (CN=sandlot-prov), and each node fetches ITS OWN via
# deploy/k8s/k8s-host-setup.sh --stream-certs-only.
#
# Shape of one per-node Secret (generated — this placeholder is documentation):
# apiVersion: v1
# kind: Secret
# metadata:
#   name: sandlot-certs-<node>   # <node> = `kubectl get nodes` name
#   namespace: sandswap
# type: Opaque
# data:
#   ca.crt: Cg==
#   client.crt: Cg==   # CN=<node>
#   client.key: Cg==
