# etcd StatefulSet for Sandswap distributed mode.
# Single replica — sufficient for demo / development. For production,
# increase replicas to 3 and set --initial-cluster-state=existing.
#
# TLS: All client connections use HTTPS with mTLS (--client-cert-auth).
# The gateway authenticates via client certificate (/etcd-certs/client.crt)
# instead of username/password — client certs are more secure (private key
# never appears in logs, environment variables, or etcd data).
#
# The etcd CA is INDEPENDENT of the stream CA (gen-k8s-certs.sh mints
# ca-etcd): --trusted-ca-file is ca-etcd.crt, so a compromised sandlot pod
# holding its own node stream certificate CANNOT use it as an etcd client.
#
# Certificates are mounted from the etcd-certs / etcd-server-certs Secrets
# (generated by deploy/k8s/gen-k8s-certs.sh).
#
# Note: The upstream etcd image (quay.io/coreos/etcd:v3.5.16) runs as
# root (UID 0) and requires a writable filesystem. Security hardening
# (runAsNonRoot, readOnlyRootFilesystem) is not applied here because
# the image doesn't support it. For production, use a hardened etcd
# image (e.g., gcr.io/etcd-development/etcd with a custom entrypoint)
# or a managed etcd service.
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: sandswap
  labels:
    app: etcd
spec:
  serviceName: etcd
  replicas: 1
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      initContainers:
        # the etcd image is distroless; use the sandlot image for the
        # copy. Secrets mounted raw land 0777 on this k3s (probed); this
        # re-materializes them with enforced modes on a plain emptyDir
        # (server+client keys 0400).
        - name: certs-copy
          # The gateway image, not the sandlot one: etcd is applied in BOTH k8s
          # modes, and boxout mode's build list (build-images.sh) does not
          # include the plain sandlot image — a boxout-first deploy hit
          # ErrImageNeverPull on this init container (the embedded leg had
          # imported it first, masking the gap in the battery order). The
          # gateway image is imported in EVERY mode and this init only runs
          # cp/chmod/stat.
          image: sandswap/gateway:latest
          imagePullPolicy: Never
          securityContext:
            runAsUser: 0
          command: ["sh", "-c"]
          args:
            - |
              set -e
              cp /certs-src/client.crt /certs/client.crt
              cp /certs-src/client.key /certs/client.key
              cp /certs-src/ca.crt /certs/ca.crt
              cp /server-src/server.crt /certs/server.crt
              cp /server-src/server.key /certs/server.key
              cp /server-src/ca-etcd.crt /certs/ca-etcd.crt
              chmod 0644 /certs/client.crt /certs/ca.crt /certs/ca-etcd.crt /certs/server.crt
              chmod 0400 /certs/client.key /certs/server.key
              echo "etcd certs: key=$(stat -c '%a %u:%g' /certs/server.key)"
          volumeMounts:
            - name: certs-src
              mountPath: /certs-src
              readOnly: true
            - name: server-certs-src
              mountPath: /server-src
              readOnly: true
            - name: certs
              mountPath: /certs
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.16
          ports:
            - containerPort: 2379
          command:
            - etcd
            - --listen-client-urls
            - https://0.0.0.0:2379
            - --advertise-client-urls
            - https://etcd-0.etcd.sandswap.svc.cluster.local:2379
            - --data-dir
            - /etcd-data
            - --auto-compaction-retention=1
            - --cert-file
            - /certs/server.crt
            - --key-file
            - /certs/server.key
            - --trusted-ca-file
            # The INDEPENDENT etcd CA: node stream certificates (signed by the
            # stream CA) are not etcd clients even if a pod leaks one.
            - /certs/ca-etcd.crt
            - --client-cert-auth
          volumeMounts:
            - name: etcd-data
              mountPath: /etcd-data
            - name: certs
              mountPath: /certs
              readOnly: true
          readinessProbe:
            exec:
              # The probe is a TLS CLIENT of an etcd running --client-cert-auth,
              # so it must present a clientAuth certificate: the server cert
              # carries EKU serverAuth only, and Go's TLS server verifies client
              # leaves with ExtKeyUsageClientAuth (a serverAuth-only cert is
              # rejected — probe fails, pod never Ready, every k8s deploy
              # aborts at the wait-for-etcd step).
              command:
                - etcdctl
                - --endpoints=https://localhost:2379
                - --cacert=/certs/ca-etcd.crt
                - --cert=/certs/client.crt
                - --key=/certs/client.key
                - endpoint
                - health
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: certs
          emptyDir: {}
          # NOT a direct Secret mount: defaultMode is not dependable
          # on this k3s (0777 landed for an explicit 0400) and the server key
          # must be readable by etcd alone. Re-materialized by the certs-copy
          # init container above.
        - name: certs-src
          secret:
            secretName: etcd-certs
        - name: server-certs-src
          secret:
            secretName: etcd-server-certs
  volumeClaimTemplates:
    - metadata:
        name: etcd-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: sandswap
spec:
  clusterIP: None  # Headless service — direct pod DNS: etcd-0.etcd.sandswap.svc.cluster.local
  selector:
    app: etcd
  ports:
    - name: client
      port: 2379
      targetPort: 2379
